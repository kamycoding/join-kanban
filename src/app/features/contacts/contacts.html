<div class="contacts-page">
  <app-contact-list
    [contacts]="contacts()"
    [selectedContact]="selectedContact()"
    (contactSelected)="selectContact($event)"
    (addRequested)="openAddDialog()"
  />

  <main class="contacts-content">
    <div class="contacts-heading">
      <h1>Contacts</h1>

      <span class="contacts-heading__divider" aria-hidden="true"></span>

      <p>Better with a team</p>
    </div>

    @if (selectedContact(); as contact) {
      <app-contact-detail
        [contact]="contact"
        (back)="clearSelection()"
        (editContact)="openEditDialog($event)"
        (deleteContact)="deleteContact($event)"
      />
    }

    @if (successMessage(); as message) {
      <div class="contacts-toast-viewport">
        <app-toast [message]="message" (dismissed)="dismissToast()" />
      </div>
    }
  </main>
</div>

@if (dialogState(); as dialog) {
  <app-contact-dialog
    [state]="dialog"
    [saving]="savingContact()"
    (close)="closeDialog()"
    (submitted)="saveContact($event)"
    (deleteContact)="deleteContact($event)"
  />
}
