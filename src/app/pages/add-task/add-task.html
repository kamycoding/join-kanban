<div class="add-task-page" [class.add-task-page--in-overlay]="inOverlay()">
  @if (!inOverlay()) {
    <h1>Add Task</h1>
  }

  <app-task-form
    mode="create"
    [secondaryAction]="inOverlay() ? 'cancel' : 'clear'"
    [initialValue]="initialFormValue"
    [contacts]="contacts()"
    [busy]="saving()"
    [error]="persistenceError()"
    (submitted)="onSubmitted($event)"
    (cleared)="onCleared()"
    (cancelled)="onCancelled()"
  />

  @if (successToast()) {
    <div class="add-task-page__toast">
      <app-toast message="Task successfully created" (dismissed)="successToast.set(false)" />
    </div>
  }
</div>
