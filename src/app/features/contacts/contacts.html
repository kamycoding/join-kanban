<div
  class="contacts-page"
  [class.contacts-page--detail-open]="selectedContact() !== null"
>
  <app-contact-list
    [contacts]="contacts()"
    [selectedContact]="selectedContact()"
    (contactSelected)="selectContact($event)"
    (addRequested)="openAddDialog()"
  />

  <main class="contacts-content">
    <div class="contacts-heading">
      <h1>Contacts</h1>

      @if (selectedContact()) {
        <button
          class="contacts-heading__back"
          type="button"
          aria-label="Back to contacts list"
          (click)="clearSelection()"
        >
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"
              fill="currentColor"
            />
          </svg>
        </button>
      }

      <span class="contacts-heading__divider" aria-hidden="true"></span>

      <p>Better with a team</p>
    </div>

    @if (selectedContact(); as contact) {
      <app-contact-detail
        [contact]="contact"
        (back)="clearSelection()"
        (editContact)="openEditDialog($event)"
        (deleteContact)="deleteContact($event)"
      />
    }

  </main>

  @if (successToast(); as toast) {
    @for (notification of [toast]; track notification.id) {
      <div class="contacts-toast-viewport">
        <app-toast [message]="notification.message" (dismissed)="dismissToast(notification.id)" />
      </div>
    }
  }
</div>

@if (dialogState(); as dialog) {
  <app-contact-dialog
    [state]="dialog"
    [saving]="savingContact()"
    (close)="closeDialog()"
    (submitted)="saveContact($event)"
    (deleteContact)="deleteContact($event)"
  />
}
