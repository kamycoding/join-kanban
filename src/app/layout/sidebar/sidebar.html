<nav [class.sidebar--external]="external()">
  <div class="sidebar__logo">
    <img src="img/join-logo.svg" alt="Join" />
  </div>

  <div class="sidebar__nav">
    @if (external()) {
      <a
        class="sidebar__link"
        routerLink="/login"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <span class="sidebar__icon" [style.--icon]="'url(img/icon-login.svg)'"></span>
        Log In
      </a>
    } @else {
      @for (link of links; track link.path) {
        <a
          class="sidebar__link"
          [routerLink]="link.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
        >
          <span class="sidebar__icon" [style.--icon]="'url(img/' + link.icon + '.svg)'"></span>
          {{ link.label }}
        </a>
      }
    }
  </div>

  <div class="sidebar__legal">
    @for (link of legalLinks; track link.path) {
      <a
        class="sidebar__legal-link"
        [routerLink]="link.path"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        {{ link.label }}
      </a>
    }
  </div>
</nav>
