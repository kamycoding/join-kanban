<section class="board-column">
  <header class="board-column__head">
    <h2 class="board-column__heading">{{ heading() }}</h2>

    @if (status() !== 'done') {
      <button
        class="board-column__add"
        type="button"
        [attr.aria-label]="'Add task to ' + heading()"
        (click)="addRequested.emit()"
      >
        <img src="/img/icon-add.svg" alt="" aria-hidden="true" />
      </button>
    }
  </header>

  <div
    class="board-column__tasks"
    cdkDropList
    [cdkDropListData]="tasks()"
    (cdkDropListDropped)="dropped($event)"
  >
    @for (task of tasks(); track task.id) {
      <app-task-card
        cdkDrag
        [cdkDragData]="task"
        [cdkDragDisabled]="dragDisabled()"
        [task]="task"
        [moveTargets]="moveTargets()"
        (openDetail)="detailRequested.emit($event)"
        (moveRequested)="moveRequested.emit($event)"
      />
    } @empty {
      <p class="board-column__empty">No tasks {{ heading() }}</p>
    }
  </div>
</section>
